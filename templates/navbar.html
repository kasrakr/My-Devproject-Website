{% load static %}
<header class="nav" id="siteNav">
  <div class="nav__inner">
    <a href="{% url 'projects' %}" class="nav__brand">
      <img
        src="{% static 'images/Logo.png' %}"
        alt="DevProject logo"
        id="logo"
      />
      DevProject
    </a>


    <nav class="nav__links" id="navLinks" aria-label="Primary">
      <a href="{% url 'projects' %}" class="nav__link {% if page == 'projects' %}active{% endif %}">Home</a>
      <a href="{% url 'profiles' %}" class="nav__link ">Developers</a>
      <a href="{% url 'projects' %}#about" class="nav__link">About</a>
      <a href="{% url 'projects' %}#features" class="nav__link">Features</a>
      <a href="{% url 'projects' %}#stack" class="nav__link">Stack</a>
      <a href="{% url 'projects' %}#projectss" class="nav__link">Projects</a>
      <a href="{% url 'projects' %}#contact" class="nav__link">Contact</a>
    </nav>
    {% if request.user.is_authenticated %}
    <div class="nav__actions">
      <a href="{% url 'inbox' %}" class="btn btn--ghost btn--sm nav__inbox-link"
        >Inbox{% if unread_message_count %}<span class="nav__inbox-badge">{{ unread_message_count }}</span>{% endif %}</a
      >
      <a href="{% url 'account' %}" class="btn btn--primary btn--sm"
        >Account</a
      >
      <a href="{% url 'logout' %}" class="btn btn--ghost btn--sm"
        >Logout</a
      >
      <button
        class="nav__toggle"
        id="navToggle"
        aria-label="Toggle menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
    {% else %}
    <div class="nav__actions">
      <a href="{% url 'login' %}" class="btn btn--primary btn--sm"
        >Login</a
      >
      <button
        class="nav__toggle"
        id="navToggle"
        aria-label="Toggle menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
    {% endif %}
    


  </div>
</header>
