{% load static %}
<header class="nav" id="siteNav">
  <div class="nav__inner">
    <a href="{% url 'projects' %}" class="nav__brand">
      <img
        src="{% static 'images/Logo.png' %}"
        alt="DevProject logo"
        id="logo"
      />
      DevProject
    </a>

    <!-- {# Anchors below point back to the home page's sections. If you reuse this
    #} {# navbar on pages other than home, keep the "{% url 'projects' %}" prefix
    so #} {# they still resolve correctly — only a plain "#about" would break
    there. #} -->
    <nav class="nav__links" id="navLinks" aria-label="Primary">
      <a href="{% url 'projects' %}" class="nav__link active">Home</a>
      <a href="{% url 'projects' %}#about" class="nav__link">About</a>
      <a href="{% url 'projects' %}#features" class="nav__link">Features</a>
      <a href="{% url 'projects' %}#stack" class="nav__link">Stack</a>
      <a href="{% url 'projects' %}#workflow" class="nav__link">Workflow</a>
      <a href="{% url 'projects' %}#preview" class="nav__link">Preview</a>
      <a href="{% url 'projects' %}#contact" class="nav__link">Contact</a>
    </nav>

    <div class="nav__actions">
      <a href="{% url 'create-project' %}" class="btn btn--primary btn--sm"
        >Create Project</a
      >
      <button
        class="nav__toggle"
        id="navToggle"
        aria-label="Toggle menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
