{% load static %}
<header class="nav" id="siteNav">
  <div class="nav__inner">
    <a href="{% url 'projects' %}" class="nav__brand">
      <img
        src="{% static 'images/Logo.png' %}"
        alt="DevProject logo"
        id="logo"
      />
      DevProject
    </a>

    <!-- {# Anchors below point back to the home page's sections. If you reuse this
    #} {# navbar on pages other than home, keep the "{% url 'projects' %}" prefix
    so #} {# they still resolve correctly — only a plain "#about" would break
    there. #} -->
    <nav class="nav__links" id="navLinks" aria-label="Primary">
      <a href="{% url 'projects' %}" class="nav__link active">Home</a>
      <a href="{% url 'projects' %}#about" class="nav__link">About</a>
      <a href="{% url 'projects' %}#features" class="nav__link">Features</a>
      <a href="{% url 'projects' %}#stack" class="nav__link">Stack</a>
      <a href="{% url 'projects' %}#workflow" class="nav__link">Workflow</a>
      <a href="{% url 'projects' %}#preview" class="nav__link">Preview</a>
      <a href="{% url 'projects' %}#contact" class="nav__link">Contact</a>
    </nav>

    <div class="nav__actions">
      <a href="{% url 'create-project' %}" class="btn btn--primary btn--sm"
        >Create Project</a
      >
      <button
        class="nav__toggle"
        id="navToggle"
        aria-label="Toggle menu"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
{% block content %}
<footer class="footer">
  <div class="section-inner footer__inner">
    <p>&copy; <span id="year">2026</span> DevProject. All rights reserved.</p>
    <div class="footer__links">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
    <div class="social-links social-links--footer">
      <a
        href="https://github.com"
        target="_blank"
        rel="noopener"
        aria-label="DevProject on GitHub"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.6.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.3-3.4-1.3-.4-1.1-1-1.4-1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.3-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.6 0 0 .8-.3 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.3.2 2.3.1 2.6.6.7 1 1.6 1 2.7 0 3.9-2.4 4.8-4.6 5 .3.3.6.9.6 1.8v2.6c0 .3.2.6.7.5 3.9-1.3 6.8-5.1 6.8-9.6C22 6.6 17.5 2 12 2Z"
          />
        </svg>
      </a>
      <a
        href="https://twitter.com"
        target="_blank"
        rel="noopener"
        aria-label="DevProject on X"
      >
        <svg viewBox="0 0 24 24">
          <path
            d="M4 4l16 16M20 4 4 20"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
      </a>
      <a
        href="https://linkedin.com"
        target="_blank"
        rel="noopener"
        aria-label="DevProject on LinkedIn"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <rect x="6.3" y="9.7" width="2.4" height="8" fill="#fff" />
          <circle cx="7.5" cy="6.6" r="1.4" fill="#fff" />
          <path
            d="M11.4 17.7V9.7h2.3v1.1c.5-.7 1.3-1.3 2.5-1.3 1.9 0 3.1 1.2 3.1 3.6v4.6h-2.4v-4.2c0-1.1-.4-1.8-1.4-1.8-.8 0-1.2.5-1.4 1-.1.2-.1.5-.1.8v4.2h-2.6Z"
            fill="#fff"
          />
        </svg>
      </a>
    </div>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="Back to top">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5" />
    <path d="M5 12l7-7 7 7" />
  </svg>
</button>
{% endblock %}
